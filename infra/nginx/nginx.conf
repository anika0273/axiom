worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        text/xml
        application/x-javascript
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m         rate=10r/s;
    limit_req_zone $binary_remote_addr zone=intelligence:10m rate=2r/s;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
        keepalive 8;
    }

    # ── Server ───────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Security headers (inherited by locations that don't add their own)
        add_header X-Content-Type-Options    "nosniff"                        always;
        add_header X-Frame-Options           "DENY"                           always;
        add_header X-XSS-Protection          "1; mode=block"                  always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ── SSE streaming endpoints (interpret / report) ──────────────────────
        # Must match before the generic /api/ block.
        # proxy_buffering off is critical for Server-Sent Events.
        location ~ ^/api/v1/[^/]+/(interpret|report) {
            limit_req zone=intelligence burst=10 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 120s;

            # Repeat security headers — child locations lose server-level add_header
            add_header X-Accel-Buffering         "no"                              always;
            add_header X-Content-Type-Options    "nosniff"                         always;
            add_header X-Frame-Options           "DENY"                            always;
            add_header X-XSS-Protection          "1; mode=block"                   always;
            add_header Referrer-Policy           "strict-origin-when-cross-origin"  always;
        }

        # ── General API endpoints ─────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection      "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # ── Frontend SPA ──────────────────────────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host       $host;
        }
    }
}
