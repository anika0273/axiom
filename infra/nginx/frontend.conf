server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback — all unknown paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML — never cache (ensures deploys take effect immediately)
    location ~* \.html$ {
        expires    -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
    }

    # Hashed static assets — cache forever (Vite adds content hash to filenames)
    location ~* \.(js|css|woff2?|ttf|eot|otf|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires    1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
}
