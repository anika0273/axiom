services:
  - type: web
    name: axiom-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: axiom-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEBUG
        value: false
    healthCheckPath: /api/v1/stats/health
    buildCommand: ""
    startCommand: >
      sh -c "
        PYTHONPATH=backend alembic upgrade head &&
        PYTHONPATH=backend uvicorn app.main:app
        --host 0.0.0.0
        --port $PORT
      "

databases:
  - name: axiom-db
    databaseName: axiom
    user: axiom
    plan: free
