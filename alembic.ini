[alembic]
# Path to migration scripts, relative to this file's directory (/app in container)
script_location = backend/migrations

# Migration file naming: <rev>_<slug>.py
file_template = %%(rev)s_%%(slug)s

# Prepend backend/ to sys.path so "from app.xxx" works in env.py
prepend_sys_path = backend

version_path_separator = os

# Placeholder — overridden at runtime in env.py from DATABASE_URL env var
sqlalchemy.url = postgresql+asyncpg://axiom:changeme@db:5432/axiom


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
